name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: opl-fleet-agent-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      native_release: ${{ steps.classify.outputs.native_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify tag against native carrier versions
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          kind="$(python3 scripts/release-tag-eligibility.py "$GITHUB_REF_NAME" Resources/Info.plist windows/src/OPLFleetAgent.Windows/OPLFleetAgent.Windows.csproj plugins/opl-fleet-agent/opl-package.json)"
          if [[ "$kind" == native ]]; then
            echo "native_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_release=false" >> "$GITHUB_OUTPUT"
            echo "Package-only tag $GITHUB_REF_NAME: native release jobs will be skipped."
          fi

  macos:
    needs: preflight
    if: needs.preflight.outputs.native_release == 'true'
    uses: gaofeng21cn/opl-release/.github/workflows/reusable-macos-sparkle-release.yml@v1
    secrets: inherit
    with:
      subject_id: opl-fleet-agent
      lane: macos-sparkle
      release_tag: ${{ github.ref_name }}
      app_name: "OPL Fleet Agent.app"
      dmg_name: OPL-Fleet-Agent.dmg
      volume_name: "OPL Fleet Agent"
      bundle_id: io.github.gaofeng21cn.opl-fleet-agent
      display_name: "OPL Fleet Agent"
      expected_team_id: SVVC4TA784
      signing_identity: "Developer ID Application: FENG GAO (SVVC4TA784)"
      expected_feed_url: "https://github.com/gaofeng21cn/opl-fleet-agent/releases/latest/download/appcast.xml"
      verify_binaries: "Contents/MacOS/OPLFleetAgent,Contents/MacOS/OPLFleetAgentProvider"
      preflight_command: |
        version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
        test "$RELEASE_TAG" = "v$version"
        xcrun swift-format lint --recursive Sources Tests Package.swift
        zsh -n scripts/build-app.sh scripts/build-dmg.sh scripts/notarize-dmg.sh scripts/generate-appcast.sh scripts/verify-release.sh
        ./Tests/notarize-dmg.test.sh
        ./Tests/user-visible-branding.test.sh
        swift test
        ./Tests/sparkle-updater-contract.test.sh
        ./Tests/windows-winsparkle-contract.test.sh
      build_app_command: 'OPL_FLEET_AGENT_ARCHS="arm64 x86_64" ./scripts/build-app.sh'

  windows:
    needs: preflight
    if: needs.preflight.outputs.native_release == 'true'
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: windows/**/packages.lock.json
      - name: Check tag, signing key, and toolchain
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          [xml]$project = Get-Content "windows/src/OPLFleetAgent.Windows/OPLFleetAgent.Windows.csproj"
          if ($project.Project.PropertyGroup.Version -ne $version) {
            throw "Tag version $version does not match Windows project version."
          }
          if ([string]::IsNullOrWhiteSpace($env:SPARKLE_ED25519_PRIVATE_KEY)) {
            throw "Missing SPARKLE_ED25519_PRIVATE_KEY secret for Windows appcast signing."
          }
          dotnet --info
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 is missing from the Windows runner."
          }
          Write-Output "Inno Setup $((Get-Item $compiler).VersionInfo.FileVersion)"
      - name: Test and build Windows release assets
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./windows/scripts/build-installer.ps1 -Runtime win-x64 -Version $version
      - name: Generate and verify Ed25519-signed Windows appcast
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./windows/scripts/generate-windows-appcast.ps1 `
            -InstallerPath "./windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe" `
            -Version $version `
            -OutputPath "./windows/dist/windows-appcast.xml" `
            -Repository $env:GITHUB_REPOSITORY `
            -RequireSigningKey
      - name: Verify Windows release assets
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assets = @(
            "./windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip",
            "./windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe"
          )
          foreach ($asset in $assets) {
            $expected = ((Get-Content "$asset.sha256" -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Checksum mismatch for $asset." }
          }

          $installer = Resolve-Path $assets[1]
          $install = Join-Path $env:RUNNER_TEMP "OPL Fleet Agent release"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/NOICONS",
            "/DIR=`"$install`""
          )
          $result = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)." }

          $executable = Get-Item (Join-Path $install "OPLFleetAgent.exe")
          if (-not $executable.VersionInfo.ProductVersion.StartsWith($version)) {
            throw "Expected installed version $version, got $($executable.VersionInfo.ProductVersion)."
          }
          $winSparkleDll = Join-Path $install "WinSparkle.dll"
          if (-not (Test-Path $winSparkleDll)) {
            throw "WinSparkle.dll is missing from installed payload."
          }
          Get-Process -Name "OPLFleetAgent" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $install "unins000.exe"
          $result = Start-Process $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait `
            -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exited with $($result.ExitCode)." }
          if (Test-Path $executable.FullName) { throw "OPLFleetAgent.exe remains after uninstall." }
          if (Test-Path $winSparkleDll) { throw "WinSparkle.dll remains after uninstall." }

          $signature = Get-AuthenticodeSignature $installer
          Write-Output "Windows Authenticode status: $($signature.Status)"
      - name: Verify Windows WinSparkle signing and silent update
        timeout-minutes: 8
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./windows/scripts/verify-updater.ps1 -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip
            windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip.sha256
            windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe
            windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
            windows/dist/windows-appcast.xml

  publish:
    needs:
      - preflight
      - macos
      - windows
    if: needs.preflight.outputs.native_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: release-assets
        run: |
          sha256sum --check OPL-Fleet-Agent.dmg.sha256
          sha256sum --check OPL-Fleet-Agent-Windows-win-x64.zip.sha256
          sha256sum --check OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            printf "## Distribution\n\nOPL Fleet Agent %s ships \`OPL-Fleet-Agent.dmg\` and Ed25519-signed Sparkle \`appcast.xml\` for macOS (supporting both in-app automatic updates and Homebrew Cask) and \`OPL-Fleet-Agent-Windows-*\` plus Ed25519-signed WinSparkle \`windows-appcast.xml\` for Windows.\n\n" "$version"
            cat <<'EOF'
          The unified OPL Homebrew Tap projects the signed and notarized macOS release after independent checksum verification (with `auto_updates true` so in-app Sparkle updates and Homebrew coexist cleanly):

          ```bash
          brew tap gaofeng21cn/one-person-lab
          brew install --cask opl-fleet-agent
          ```

          ## Agent

          Both desktop platforms ship first-class Ed25519-verified in-app automatic updates (Sparkle 2 on macOS via `appcast.xml` alongside Homebrew Cask `auto_updates true`, and WinSparkle on Windows via `windows-appcast.xml` alongside the standalone Inno Setup installer).
          EOF
          } >release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            release-assets/OPL-Fleet-Agent.dmg \
            release-assets/OPL-Fleet-Agent.dmg.sha256 \
            release-assets/appcast.xml \
            release-assets/OPL-Fleet-Agent-Windows-win-x64.zip \
            release-assets/OPL-Fleet-Agent-Windows-win-x64.zip.sha256 \
            release-assets/OPL-Fleet-Agent-Windows-win-x64-Setup.exe \
            release-assets/OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256 \
            release-assets/windows-appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --title "OPL Fleet Agent $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

  readback:
    name: Read back public Release assets
    needs:
      - preflight
      - publish
    if: needs.preflight.outputs.native_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify release tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" > "$RUNNER_TEMP/tag-commit.json"
          jq -e --arg expected "$SOURCE_SHA" '.sha == $expected' "$RUNNER_TEMP/tag-commit.json" >/dev/null

      - name: Read public Release metadata and assets anonymously
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          public_release="$RUNNER_TEMP/public-release.json"
          expected_names="$RUNNER_TEMP/expected-assets.txt"
          public_assets="$RUNNER_TEMP/public-assets"

          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            "$api/releases/tags/$RELEASE_TAG" > "$public_release"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag
            and .draft == false
            and (.assets | type == "array")
          ' "$public_release" >/dev/null

          cat > "$expected_names" <<'EOF'
          OPL-Fleet-Agent-Windows-win-x64-Setup.exe
          OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
          OPL-Fleet-Agent-Windows-win-x64.zip
          OPL-Fleet-Agent-Windows-win-x64.zip.sha256
          OPL-Fleet-Agent.dmg
          OPL-Fleet-Agent.dmg.sha256
          appcast.xml
          windows-appcast.xml
          EOF
          LC_ALL=C sort -o "$expected_names" "$expected_names"
          jq -r '.assets[].name' "$public_release" | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          if ! diff -u "$expected_names" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "Public Release asset set differs from the canonical eight-asset set." >&2
            exit 1
          fi

          mkdir -p "$public_assets"
          while IFS= read -r name; do
            url="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' "$public_release")"
            case "$url" in
              "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/"*) ;;
              *) echo "Unexpected public asset URL for $name: $url" >&2; exit 1 ;;
            esac
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o "$public_assets/$name"
          done < "$expected_names"

          (
            cd "$public_assets"
            sha256sum --check --strict \
              OPL-Fleet-Agent.dmg.sha256 \
              OPL-Fleet-Agent-Windows-win-x64.zip.sha256 \
              OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
          )

          python3 - "$public_assets/appcast.xml" "$public_assets/OPL-Fleet-Agent.dmg" "$public_assets/windows-appcast.xml" "$public_assets/OPL-Fleet-Agent-Windows-win-x64-Setup.exe" "$REPOSITORY" "$RELEASE_TAG" <<'PY'
          import base64
          import os
          import subprocess
          import sys
          import tempfile
          import xml.etree.ElementTree as ET

          appcast_path, dmg_path, win_appcast_path, win_setup_path, repo, tag = sys.argv[1:7]
          version = tag.removeprefix("v")
          sparkle_ns = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          ns = {"sparkle": sparkle_ns}
          expected_ed25519_pub_b64 = "jejOvm5dBmhSxgZBYXbiz1LWqsDyb0l+pTchZIDBS48="

          def verify_ed25519(file_path: str, sig_b64: str, label: str) -> None:
              pub_raw = base64.b64decode(expected_ed25519_pub_b64, validate=True)
              sig_raw = base64.b64decode(sig_b64, validate=True)
              if len(pub_raw) != 32 or len(sig_raw) != 64:
                  raise SystemExit(f"Invalid Ed25519 key or signature length for {label}")
              spki_der = bytes.fromhex("302a300506032b6570032100") + pub_raw
              with tempfile.TemporaryDirectory() as tmpdir:
                  pub_path = os.path.join(tmpdir, "pub.der")
                  sig_path = os.path.join(tmpdir, "sig.bin")
                  with open(pub_path, "wb") as f:
                      f.write(spki_der)
                  with open(sig_path, "wb") as f:
                      f.write(sig_raw)
                  result = subprocess.run(
                      ["openssl", "pkeyutl", "-verify", "-pubin", "-inkey", pub_path, "-keyform", "DER", "-rawin", "-in", file_path, "-sigfile", sig_path],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0:
                      raise SystemExit(f"Ed25519 verification failed for {label}: {result.stderr.strip()}")

          root = ET.parse(appcast_path).getroot()
          items = root.findall("./channel/item")
          if len(items) != 1:
              raise SystemExit(f"Expected 1 appcast item, got {len(items)}")

          item = items[0]
          if item.findtext("sparkle:shortVersionString", namespaces=ns) != version:
              raise SystemExit("Public appcast shortVersionString mismatch")
          if not item.findtext("sparkle:version", namespaces=ns):
              raise SystemExit("Public appcast missing sparkle:version")
          if item.findtext("sparkle:hardwareRequirements", namespaces=ns):
              raise SystemExit("Public universal appcast must not set hardwareRequirements")

          enclosure = item.find("enclosure")
          if enclosure is None:
              raise SystemExit("Public appcast missing enclosure")
          expected_url = f"https://github.com/{repo}/releases/download/{tag}/OPL-Fleet-Agent.dmg"
          if enclosure.attrib.get("url") != expected_url:
              raise SystemExit(f"Unexpected public appcast URL: {enclosure.attrib.get('url')}")
          if enclosure.attrib.get("length") != str(os.path.getsize(dmg_path)):
              raise SystemExit("Public appcast length does not match downloaded DMG")
          mac_sig = enclosure.attrib.get(f"{{{sparkle_ns}}}edSignature")
          if not mac_sig:
              raise SystemExit("Public appcast missing sparkle:edSignature")
          verify_ed25519(dmg_path, mac_sig, "OPL-Fleet-Agent.dmg")

          win_root = ET.parse(win_appcast_path).getroot()
          win_items = win_root.findall("./channel/item")
          if len(win_items) != 1:
              raise SystemExit(f"Expected 1 Windows appcast item, got {len(win_items)}")
          win_item = win_items[0]
          if win_item.findtext("sparkle:shortVersionString", namespaces=ns) != version:
              raise SystemExit("Public Windows appcast shortVersionString mismatch")
          if win_item.findtext("sparkle:version", namespaces=ns) != version:
              raise SystemExit("Public Windows appcast sparkle:version mismatch")
          win_enclosure = win_item.find("enclosure")
          if win_enclosure is None:
              raise SystemExit("Public Windows appcast missing enclosure")
          expected_win_url = f"https://github.com/{repo}/releases/download/{tag}/OPL-Fleet-Agent-Windows-win-x64-Setup.exe"
          if win_enclosure.attrib.get("url") != expected_win_url:
              raise SystemExit(f"Unexpected public Windows appcast URL: {win_enclosure.attrib.get('url')}")
          if win_enclosure.attrib.get("length") != str(os.path.getsize(win_setup_path)):
              raise SystemExit("Public Windows appcast length does not match downloaded installer")
          if win_enclosure.attrib.get(f"{{{sparkle_ns}}}os") != "windows-x64":
              raise SystemExit("Public Windows appcast sparkle:os mismatch")
          win_args = win_enclosure.attrib.get(f"{{{sparkle_ns}}}installerArguments", "")
          if "/SILENT" not in win_args or "/LAUNCHAFTERUPDATE=1" not in win_args:
              raise SystemExit(f"Unexpected Windows appcast installerArguments: {win_args!r}")
          win_sig = win_enclosure.attrib.get(f"{{{sparkle_ns}}}edSignature")
          if not win_sig:
              raise SystemExit("Public Windows appcast missing sparkle:edSignature")
          verify_ed25519(win_setup_path, win_sig, "OPL-Fleet-Agent-Windows-win-x64-Setup.exe")
          PY

          jq -n \
            --arg schema "opl_fleet_agent_release_public_readback.v1" \
            --arg repository "$REPOSITORY" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile release "$public_release" \
            '{
              schema: $schema,
              status: "passed",
              repository: $repository,
              source_run_id: ($source_run_id | tonumber),
              release_tag: $release_tag,
              source_sha: $source_sha,
              public_release_id: $release[0].id,
              draft: $release[0].draft,
              prerelease: $release[0].prerelease,
              assets: ($release[0].assets | map(.name) | sort),
              anonymous_downloads: true,
              checked_at: $checked_at
            }' > release-public-readback.json

          printf 'Public Release %s passed anonymous asset and checksum readback for run %s (%s).\n' \
            "$RELEASE_TAG" "$SOURCE_RUN_ID" "$SOURCE_SHA"

      - name: Upload readback receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-fleet-agent-release-public-readback-${{ github.run_id }}
          path: release-public-readback.json
          if-no-files-found: error
          retention-days: 14
