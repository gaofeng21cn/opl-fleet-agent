name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: codex-tps-release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    environment: release
    env:
      APPLE_TEAM_ID: SVVC4TA784
      CODEX_TPS_SIGNING_IDENTITY: "Developer ID Application: FENG GAO (SVVC4TA784)"
      CODEX_TPS_EXPECTED_TEAM_ID: SVVC4TA784
      CODEX_TPS_REQUIRE_DEVELOPER_ID: "1"
      CODEX_TPS_NOTARY_PROFILE: codex-tps-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --show-sdk-version
      - name: Check tag version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Lint
        run: |
          xcrun swift-format lint --recursive Sources Tests Package.swift
          bash -n scripts/install-release.sh
          bash -n scripts/verify-updater.sh
          zsh -n scripts/build-dmg.sh scripts/notarize-dmg.sh scripts/verify-release.sh
          ./Tests/notarize-dmg.test.sh
          ./Tests/user-visible-branding.test.sh
      - name: Test
        run: swift test

      - name: Configure protected Apple credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?Missing Developer ID P12}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?Missing Developer ID P12 password}"
          : "${APPLE_NOTARY_APPLE_ID:?Missing notarization Apple ID}"
          : "${APPLE_NOTARY_PASSWORD:?Missing notarization app-specific password}"

          keychain="$RUNNER_TEMP/codex-tps-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/DeveloperIDApplication.p12"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode >"$p12_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

          xcrun notarytool store-credentials "$CODEX_TPS_NOTARY_PROFILE" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --keychain "$keychain"

          security find-identity -v -p codesigning "$keychain" | grep -F "$CODEX_TPS_SIGNING_IDENTITY"
          echo "CODEX_TPS_NOTARY_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Build signed universal app
        run: CODEX_TPS_ARCHS="arm64 x86_64" ./scripts/build-app.sh

      - name: Notarize app and DMG, staple both, and verify release bytes
        env:
          CODEX_TPS_EXPECTED_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_TPS_EXPECTED_VERSION="${CODEX_TPS_EXPECTED_VERSION#v}"
          ./scripts/notarize-dmg.sh
          ./scripts/verify-release.sh

      - name: Verify signed updater transaction
        run: ./scripts/verify-updater.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            dist/Codex-TPS.dmg
            dist/Codex-TPS.dmg.sha256

      - name: Remove temporary Apple credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${CODEX_TPS_NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CODEX_TPS_NOTARY_KEYCHAIN" || true
          fi

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: windows/**/packages.lock.json
      - name: Check tag and toolchain
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          [xml]$project = Get-Content "windows/src/CodexTPS.Windows/CodexTPS.Windows.csproj"
          if ($project.Project.PropertyGroup.Version -ne $version) {
            throw "Tag version $version does not match Windows project version."
          }
          dotnet --info
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 is missing from the Windows runner."
          }
          Write-Output "Inno Setup $((Get-Item $compiler).VersionInfo.FileVersion)"
      - name: Test and build Windows release assets
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./windows/scripts/build-installer.ps1 -Runtime win-x64 -Version $version
      - name: Verify Windows release assets
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assets = @(
            "./windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip",
            "./windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe",
            "./windows/dist/Codex-TPS-Windows-win-x64.zip",
            "./windows/dist/Codex-TPS-Windows-win-x64-Setup.exe"
          )
          foreach ($asset in $assets) {
            $expected = ((Get-Content "$asset.sha256" -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Checksum mismatch for $asset." }
          }

          $installer = Resolve-Path $assets[1]
          $install = Join-Path $env:RUNNER_TEMP "OPL Fleet Agent release"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/NOICONS",
            "/DIR=`"$install`""
          )
          $result = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)." }

          $executable = Get-Item (Join-Path $install "OPLFleetAgent.exe")
          if (-not $executable.VersionInfo.ProductVersion.StartsWith($version)) {
            throw "Expected installed version $version, got $($executable.VersionInfo.ProductVersion)."
          }
          if (Test-Path (Join-Path $install "CodexTPS.exe")) {
            throw "Fresh release install must not contain CodexTPS.exe."
          }
          Get-Process -Name "OPLFleetAgent" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $install "unins000.exe"
          $result = Start-Process $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait `
            -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exited with $($result.ExitCode)." }
          if (Test-Path $executable.FullName) { throw "OPLFleetAgent.exe remains after uninstall." }

          $signature = Get-AuthenticodeSignature $installer
          Write-Output "Windows Authenticode status: $($signature.Status)"
      - name: Verify Windows in-app updater handoff
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./windows/scripts/verify-updater.ps1 -Version $version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            windows/dist/Codex-TPS-Windows-win-x64.zip
            windows/dist/Codex-TPS-Windows-win-x64.zip.sha256
            windows/dist/Codex-TPS-Windows-win-x64-Setup.exe
            windows/dist/Codex-TPS-Windows-win-x64-Setup.exe.sha256
            windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip
            windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip.sha256
            windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe
            windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256

  publish:
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: release-assets
        run: |
          sha256sum --check Codex-TPS.dmg.sha256
          sha256sum --check Codex-TPS-Windows-win-x64.zip.sha256
          sha256sum --check Codex-TPS-Windows-win-x64-Setup.exe.sha256
          sha256sum --check OPL-Fleet-Agent-Windows-win-x64.zip.sha256
          sha256sum --check OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >release-notes.md <<'EOF'
          ## macOS

          Version 0.2.38 replaces the retired Gateway label with `Fleet Gateway` in the compact menu-bar connection row and `OPL Fleet Gateway` in full settings, help text, and connection diagnostics. Discovery, pairing, telemetry, and Cockpit freshness behavior are unchanged. It includes the automatic LAN Gateway reporting recovery shipped in 0.2.37.

          ## Windows

          The compact tray dashboard uses `Fleet Gateway`; settings and connection diagnostics use the full `OPL Fleet Gateway` name. Discovery, pairing, telemetry, and Cockpit freshness behavior are unchanged.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            release-assets/Codex-TPS.dmg \
            release-assets/Codex-TPS.dmg.sha256 \
            release-assets/Codex-TPS-Windows-win-x64.zip \
            release-assets/Codex-TPS-Windows-win-x64.zip.sha256 \
            release-assets/Codex-TPS-Windows-win-x64-Setup.exe \
            release-assets/Codex-TPS-Windows-win-x64-Setup.exe.sha256 \
            release-assets/OPL-Fleet-Agent-Windows-win-x64.zip \
            release-assets/OPL-Fleet-Agent-Windows-win-x64.zip.sha256 \
            release-assets/OPL-Fleet-Agent-Windows-win-x64-Setup.exe \
            release-assets/OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "OPL Fleet Agent $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
