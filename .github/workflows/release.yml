name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: opl-fleet-agent-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      native_release: ${{ steps.classify.outputs.native_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify tag against native carrier versions
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          kind="$(python3 scripts/release-tag-eligibility.py "$GITHUB_REF_NAME" Resources/Info.plist windows/src/OPLFleetAgent.Windows/OPLFleetAgent.Windows.csproj plugins/opl-fleet-agent/opl-package.json)"
          if [[ "$kind" == native ]]; then
            echo "native_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_release=false" >> "$GITHUB_OUTPUT"
            echo "Package-only tag $GITHUB_REF_NAME: native release jobs will be skipped."
          fi

  macos:
    needs: preflight
    if: needs.preflight.outputs.native_release == 'true'
    runs-on: macos-latest
    environment: release
    env:
      APPLE_TEAM_ID: SVVC4TA784
      OPL_FLEET_AGENT_SIGNING_IDENTITY: "Developer ID Application: FENG GAO (SVVC4TA784)"
      OPL_FLEET_AGENT_EXPECTED_TEAM_ID: SVVC4TA784
      OPL_FLEET_AGENT_REQUIRE_DEVELOPER_ID: "1"
      OPL_FLEET_AGENT_NOTARY_PROFILE: opl-fleet-agent-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --show-sdk-version
      - name: Check tag version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Lint
        run: |
          xcrun swift-format lint --recursive Sources Tests Package.swift
          zsh -n scripts/build-app.sh scripts/build-dmg.sh scripts/notarize-dmg.sh scripts/verify-release.sh
          ./Tests/notarize-dmg.test.sh
          ./Tests/user-visible-branding.test.sh
      - name: Test
        run: swift test

      - name: Configure protected Apple credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?Missing Developer ID P12}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?Missing Developer ID P12 password}"
          : "${APPLE_NOTARY_APPLE_ID:?Missing notarization Apple ID}"
          : "${APPLE_NOTARY_PASSWORD:?Missing notarization app-specific password}"

          keychain="$RUNNER_TEMP/opl-fleet-agent-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/DeveloperIDApplication.p12"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode >"$p12_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

          xcrun notarytool store-credentials "$OPL_FLEET_AGENT_NOTARY_PROFILE" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --keychain "$keychain"

          security find-identity -v -p codesigning "$keychain" | grep -F "$OPL_FLEET_AGENT_SIGNING_IDENTITY"
          echo "OPL_FLEET_AGENT_NOTARY_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Build signed universal app
        run: OPL_FLEET_AGENT_ARCHS="arm64 x86_64" ./scripts/build-app.sh

      - name: Notarize app and DMG, staple both, and verify release bytes
        env:
          OPL_FLEET_AGENT_EXPECTED_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          export OPL_FLEET_AGENT_EXPECTED_VERSION="${OPL_FLEET_AGENT_EXPECTED_VERSION#v}"
          ./scripts/notarize-dmg.sh
          ./scripts/verify-release.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            dist/OPL-Fleet-Agent.dmg
            dist/OPL-Fleet-Agent.dmg.sha256

      - name: Remove temporary Apple credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${OPL_FLEET_AGENT_NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$OPL_FLEET_AGENT_NOTARY_KEYCHAIN" || true
          fi

  windows:
    needs: preflight
    if: needs.preflight.outputs.native_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: windows/**/packages.lock.json
      - name: Check tag and toolchain
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          [xml]$project = Get-Content "windows/src/OPLFleetAgent.Windows/OPLFleetAgent.Windows.csproj"
          if ($project.Project.PropertyGroup.Version -ne $version) {
            throw "Tag version $version does not match Windows project version."
          }
          dotnet --info
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 is missing from the Windows runner."
          }
          Write-Output "Inno Setup $((Get-Item $compiler).VersionInfo.FileVersion)"
      - name: Test and build Windows release assets
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./windows/scripts/build-installer.ps1 -Runtime win-x64 -Version $version
      - name: Verify Windows release assets
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assets = @(
            "./windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip",
            "./windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe"
          )
          foreach ($asset in $assets) {
            $expected = ((Get-Content "$asset.sha256" -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Checksum mismatch for $asset." }
          }

          $installer = Resolve-Path $assets[1]
          $install = Join-Path $env:RUNNER_TEMP "OPL Fleet Agent release"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/NOICONS",
            "/DIR=`"$install`""
          )
          $result = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)." }

          $executable = Get-Item (Join-Path $install "OPLFleetAgent.exe")
          if (-not $executable.VersionInfo.ProductVersion.StartsWith($version)) {
            throw "Expected installed version $version, got $($executable.VersionInfo.ProductVersion)."
          }
          Get-Process -Name "OPLFleetAgent" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $install "unins000.exe"
          $result = Start-Process $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait `
            -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exited with $($result.ExitCode)." }
          if (Test-Path $executable.FullName) { throw "OPLFleetAgent.exe remains after uninstall." }

          $signature = Get-AuthenticodeSignature $installer
          Write-Output "Windows Authenticode status: $($signature.Status)"
      - name: Verify Windows in-app updater handoff
        timeout-minutes: 8
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./windows/scripts/verify-updater.ps1 -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip
            windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip.sha256
            windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe
            windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256

  publish:
    needs:
      - preflight
      - macos
      - windows
    if: needs.preflight.outputs.native_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: release-assets
        run: |
          sha256sum --check OPL-Fleet-Agent.dmg.sha256
          sha256sum --check OPL-Fleet-Agent-Windows-win-x64.zip.sha256
          sha256sum --check OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            printf "## Distribution\n\nOPL Fleet Agent %s ships \`OPL-Fleet-Agent.dmg\` for macOS and \`OPL-Fleet-Agent-Windows-*\` assets for Windows.\n\n" "$version"
            cat <<'EOF'
          The unified OPL Homebrew Tap projects the signed and notarized macOS release after independent checksum verification:

          ```bash
          brew tap gaofeng21cn/one-person-lab
          brew install --cask opl-fleet-agent
          ```

          ## Agent

          macOS now collects Antigravity (desktop/IDE and `agy` CLI) token throughput alongside Codex in the menu bar, Direct LAN status, Gateway pushes, and local CLI tools, with per-source breakdown and independent switches in the menu-bar panel.
          EOF
          } >release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            release-assets/OPL-Fleet-Agent.dmg \
            release-assets/OPL-Fleet-Agent.dmg.sha256 \
            release-assets/OPL-Fleet-Agent-Windows-win-x64.zip \
            release-assets/OPL-Fleet-Agent-Windows-win-x64.zip.sha256 \
            release-assets/OPL-Fleet-Agent-Windows-win-x64-Setup.exe \
            release-assets/OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "OPL Fleet Agent $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

  readback:
    name: Read back public Release assets
    needs:
      - preflight
      - publish
    if: needs.preflight.outputs.native_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify release tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" > "$RUNNER_TEMP/tag-commit.json"
          jq -e --arg expected "$SOURCE_SHA" '.sha == $expected' "$RUNNER_TEMP/tag-commit.json" >/dev/null

      - name: Read public Release metadata and assets anonymously
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          public_release="$RUNNER_TEMP/public-release.json"
          expected_names="$RUNNER_TEMP/expected-assets.txt"
          public_assets="$RUNNER_TEMP/public-assets"

          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            "$api/releases/tags/$RELEASE_TAG" > "$public_release"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag
            and .draft == false
            and (.assets | type == "array")
          ' "$public_release" >/dev/null

          cat > "$expected_names" <<'EOF'
          OPL-Fleet-Agent-Windows-win-x64-Setup.exe
          OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
          OPL-Fleet-Agent-Windows-win-x64.zip
          OPL-Fleet-Agent-Windows-win-x64.zip.sha256
          OPL-Fleet-Agent.dmg
          OPL-Fleet-Agent.dmg.sha256
          EOF
          LC_ALL=C sort -o "$expected_names" "$expected_names"
          jq -r '.assets[].name' "$public_release" | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          if ! diff -u "$expected_names" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "Public Release asset set differs from the canonical six-asset set." >&2
            exit 1
          fi

          mkdir -p "$public_assets"
          while IFS= read -r name; do
            url="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' "$public_release")"
            case "$url" in
              "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/"*) ;;
              *) echo "Unexpected public asset URL for $name: $url" >&2; exit 1 ;;
            esac
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o "$public_assets/$name"
          done < "$expected_names"

          (
            cd "$public_assets"
            sha256sum --check --strict \
              OPL-Fleet-Agent.dmg.sha256 \
              OPL-Fleet-Agent-Windows-win-x64.zip.sha256 \
              OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
          )

          jq -n \
            --arg schema "opl_fleet_agent_release_public_readback.v1" \
            --arg repository "$REPOSITORY" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile release "$public_release" \
            '{
              schema: $schema,
              status: "passed",
              repository: $repository,
              source_run_id: ($source_run_id | tonumber),
              release_tag: $release_tag,
              source_sha: $source_sha,
              public_release_id: $release[0].id,
              draft: $release[0].draft,
              prerelease: $release[0].prerelease,
              assets: ($release[0].assets | map(.name) | sort),
              anonymous_downloads: true,
              checked_at: $checked_at
            }' > release-public-readback.json

          printf 'Public Release %s passed anonymous asset and checksum readback for run %s (%s).\n' \
            "$RELEASE_TAG" "$SOURCE_RUN_ID" "$SOURCE_SHA"

      - name: Upload readback receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-fleet-agent-release-public-readback-${{ github.run_id }}
          path: release-public-readback.json
          if-no-files-found: error
          retention-days: 14
