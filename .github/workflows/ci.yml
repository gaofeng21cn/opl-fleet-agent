name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
      - name: Lint and source tests
        run: |
          xcrun swift-format lint --recursive Sources Tests Package.swift
          bash -n scripts/install-release.sh scripts/verify-updater.sh
          ./Tests/user-visible-branding.test.sh
          swift test
          node --test plugins/opl-fleet-agent/tests/adapter.test.mjs
