name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --show-sdk-version
      - name: Lint
        run: |
          xcrun swift-format lint --recursive Sources Tests Package.swift
          bash -n scripts/install-release.sh
          bash -n scripts/verify-updater.sh
      - name: Test
        run: swift test
      - name: Package DMG
        run: ./scripts/build-dmg.sh
      - name: Verify updater transaction
        env:
          CODEX_TPS_UPDATER_VERIFY_MODE: adhoc
        run: ./scripts/verify-updater.sh
      - uses: actions/upload-artifact@v7
        with:
          name: codex-tps-dmg
          path: |
            dist/Codex-TPS.dmg
            dist/Codex-TPS.dmg.sha256

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: windows/**/packages.lock.json
      - name: Toolchain
        run: |
          dotnet --info
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 is missing from the Windows runner."
          }
          Write-Output "Inno Setup $((Get-Item $compiler).VersionInfo.FileVersion)"
      - name: Test and build Windows packages
        run: ./windows/scripts/build-installer.ps1 -Runtime win-x64 -Version 0.2.33
      - name: Verify portable package
        run: |
          $archive = "./windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip"
          $install = Join-Path $env:RUNNER_TEMP "OPL Fleet Agent portable"
          ./windows/scripts/install.ps1 -ArchivePath $archive -InstallDirectory $install -NoLaunch
          $executable = Get-Item (Join-Path $install "OPLFleetAgent.exe")
          if (-not $executable.VersionInfo.ProductVersion.StartsWith("0.2.33")) {
            throw "Expected Windows product version 0.2.33, got $($executable.VersionInfo.ProductVersion)."
          }
          Write-Output "Verified $($executable.FullName) $($executable.VersionInfo.ProductVersion)"
      - name: Verify Windows installer and uninstaller
        run: |
          $installer = Resolve-Path "./windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe"
          $checksum = "$installer.sha256"
          $expected = ((Get-Content $checksum -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Windows installer checksum mismatch." }

          $install = Join-Path $env:RUNNER_TEMP "OPL Fleet Agent setup"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/NOICONS",
            "/DIR=`"$install`""
          )
          $result = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)." }

          $executable = Get-Item (Join-Path $install "OPLFleetAgent.exe")
          if (-not $executable.VersionInfo.ProductVersion.StartsWith("0.2.33")) {
            throw "Expected installed version 0.2.33, got $($executable.VersionInfo.ProductVersion)."
          }
          Get-Process -Name "OPLFleetAgent" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $install "unins000.exe"
          $result = Start-Process $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait `
            -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exited with $($result.ExitCode)." }
          if (Test-Path $executable.FullName) { throw "OPLFleetAgent.exe remains after uninstall." }
          Write-Output "Verified installer, version, checksum, and uninstall."
      # The end-to-end updater handoff is release-only. It installs a prior
      # release and relaunches the app, so it belongs to release.yml where the
      # published asset is authoritative. Keeping it out of every branch CI
      # run prevents a hosted-runner failure from blocking routine validation.
      - uses: actions/upload-artifact@v7
        with:
          name: codex-tps-windows-win-x64
          path: |
            windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip
            windows/dist/OPL-Fleet-Agent-Windows-win-x64.zip.sha256
            windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe
            windows/dist/OPL-Fleet-Agent-Windows-win-x64-Setup.exe.sha256
            windows/dist/Codex-TPS-Windows-win-x64.zip
            windows/dist/Codex-TPS-Windows-win-x64.zip.sha256
            windows/dist/Codex-TPS-Windows-win-x64-Setup.exe
            windows/dist/Codex-TPS-Windows-win-x64-Setup.exe.sha256
